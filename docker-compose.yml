version: '3.8'

services:
  db-local:
    image: postgres:15-alpine
    container_name: db_local
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - db_data_local:/var/lib/postgresql/data

volumes:
  db_data_local: